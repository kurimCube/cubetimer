<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="キューブタイマー" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>軽量キューブタイマー</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section id="timer-view" class="view timer-view" aria-labelledby="app-title">
        <header class="app-header">
          <div>
            <p class="eyebrow">CUBE TIMER</p>
            <h1 id="app-title">軽量キューブタイマー</h1>
          </div>
          <div class="puzzle-switch" aria-label="種目切替">
            <button class="puzzle-button is-active" data-puzzle="333" type="button" aria-pressed="true">3×3</button>
            <button class="puzzle-button" data-puzzle="777" type="button" aria-pressed="false">7×7</button>
          </div>
        </header>

        <section class="scramble-card" aria-labelledby="scramble-heading">
          <div class="section-heading-row">
            <h2 id="scramble-heading">スクランブル</h2>
            <button id="scramble-retry" class="text-button" type="button" hidden>再試行</button>
          </div>
          <p id="scramble" class="scramble" aria-live="polite">スクランブル生成中</p>
        </section>

        <button id="timer-pad" class="timer-pad" type="button" disabled aria-describedby="timer-instruction">
          <output id="timer-output" class="timer-output" aria-label="計測タイム">0.00</output>
          <span id="timer-instruction" class="timer-instruction" aria-live="polite">準備中</span>
        </button>

        <div id="save-error" class="error-panel" role="alert" hidden>
          <p id="save-error-message">タイムを保存できませんでした。</p>
          <div class="error-actions">
            <button id="save-retry" class="primary-button" type="button">再試行</button>
            <button id="save-discard" class="secondary-button danger" type="button">破棄</button>
          </div>
        </div>

        <section class="recent-card" aria-labelledby="recent-heading">
          <div class="section-heading-row">
            <h2 id="recent-heading">最近のタイム</h2>
            <button id="open-history" class="text-button" type="button">履歴を見る</button>
          </div>
          <ol id="recent-list" class="recent-list">
            <li class="empty-message">記録はまだありません</li>
          </ol>
        </section>
      </section>

      <section id="history-view" class="view history-view" aria-labelledby="history-heading" hidden>
        <header class="history-header">
          <button id="close-history" class="back-button" type="button" aria-label="タイマーへ戻る">←</button>
          <h1 id="history-heading">履歴</h1>
        </header>
        <div id="history-filters" class="history-filters" aria-label="履歴の種目フィルター">
          <button type="button" data-filter="all" aria-pressed="true">すべて</button>
          <button type="button" data-filter="333" aria-pressed="false">3×3</button>
          <button type="button" data-filter="777" aria-pressed="false">7×7</button>
        </div>
        <p id="history-status" class="history-status" aria-live="polite"></p>
        <ol id="history-list" class="history-list"></ol>
        <button id="load-more" class="secondary-button load-more" type="button" hidden>さらに読み込む</button>
      </section>

      <aside id="update-banner" class="update-banner" aria-live="polite" hidden>
        <span>新しいバージョンがあります</span>
        <button id="apply-update" class="primary-button compact" type="button">更新</button>
      </aside>
    </main>

    <dialog id="confirm-dialog" class="confirm-dialog">
      <form method="dialog">
        <h2 id="confirm-title">確認</h2>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button value="cancel" class="secondary-button">キャンセル</button>
          <button value="confirm" class="primary-button danger">実行</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
